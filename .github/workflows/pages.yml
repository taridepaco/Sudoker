# Publishes dist/ to GitHub Pages. Knows nothing about the project: it runs deploy/test.sh (if
# there is one) and deploy/build.sh, the same build the home server uses.
#   pull request:            test and build, without publishing
#   push to main, or by hand: test, build and publish
# Settings → Pages → Build and deployment → Source: GitHub Actions.
# Common to every taridepaco site, copied from taridepaco.github.io: do not edit it here.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # never stop a deployment halfway; in pull requests, a new push cancels the previous run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: hashFiles('package.json') != ''
        with:
          node-version: 24
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Test
        if: hashFiles('deploy/test.sh') != ''
        run: bash deploy/test.sh

      - name: Build
        run: bash deploy/build.sh

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
