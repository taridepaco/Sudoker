<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sudoker</title>
  <meta name="description" content="Sudoku: juega con notas y pistas explicadas, o resuelve cualquier sudoku paso a paso. Play with notes and explained hints, or solve any sudoku step by step.">
  <script>
    // idioma antes del primer pintado: ?lang=, última elección, idioma del navegador
    (function () {
      var l = null;
      try {
        var q = new URLSearchParams(location.search).get("lang");
        if (q === "es" || q === "en") l = q;
        else { var s = localStorage.getItem("taridepaco-lang"); if (s === "es" || s === "en") l = s; }
      } catch (e) { /* sin almacenamiento */ }
      if (!l) l = /^es\b/i.test(navigator.language || "") ? "es" : "en";
      document.documentElement.lang = l;
    })();
  </script>
  <script src="js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Martian+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/system.css">
  <link rel="stylesheet" href="css/sudoker.css">
  <link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body data-mode="play">
  <header class="topbar">
    <a class="util back" href="https://taridepaco.github.io/"><span class="back-arrow" aria-hidden="true">←</span><span class="back-text"> taridepaco</span></a>
    <h1>Sudoker</h1>
    <span class="tag" data-i18n="kind">Juego</span>
    <button class="chip theme-btn" type="button">Tema: auto</button>
    <div class="lang-switch" role="group" aria-label="Language / Idioma">
      <button type="button" data-lang="es" lang="es" aria-label="Español" aria-pressed="true">ES</button>
      <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="app">
    <details id="panel" open>
      <summary><span class="util" data-i18n="panel">Controles</span></summary>
      <script>
        // móvil y pantallas bajas: panel plegado antes del primer pintado
        if (window.matchMedia && matchMedia("(max-width: 720px), (max-height: 500px)").matches) document.getElementById("panel").open = false;
      </script>
      <div id="controls">
        <p class="pitch" data-i18n="pitch"></p>

        <fieldset>
          <legend data-i18n="g.mode">Modo</legend>
          <div class="modes">
            <input type="radio" name="mode" id="mode-play" value="play" checked><label for="mode-play" data-i18n="mode.play">Jugar</label>
            <input type="radio" name="mode" id="mode-solve" value="solve"><label for="mode-solve" data-i18n="mode.solve">Resolver</label>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="g.level">Dificultad</legend>
          <span class="select"><select id="level" data-i18n-aria="g.level">
            <option value="easy" data-i18n="lv.easy">Fácil</option>
            <option value="medium" data-i18n="lv.medium">Medio</option>
            <option value="hard" data-i18n="lv.hard">Difícil</option>
          </select></span>
        </fieldset>

        <fieldset data-mode="play">
          <legend data-i18n="g.game">Partida</legend>
          <div class="buttons">
            <button class="btn wide" type="button" data-act="newGame" data-i18n="act.new">Nueva partida</button>
            <button class="btn ghost desk" type="button" data-act="hint" data-i18n="act.hint">Pista</button>
            <button class="btn ghost" type="button" data-act="check" data-i18n="act.check">Comprobar</button>
            <button class="btn ghost desk" type="button" data-act="undo" data-i18n="act.undo">Deshacer</button>
            <button class="btn ghost" type="button" data-act="redo" data-i18n="act.redo">Rehacer</button>
            <button class="btn ghost desk" type="button" data-act="erase" data-i18n="act.erase">Borrar</button>
            <button class="btn ghost" type="button" data-act="pause"><span data-i18n="act.pause">Pausa</span></button>
            <button class="btn ghost" type="button" data-act="restart" data-i18n="act.restart">Reiniciar</button>
            <button class="btn ghost wide" type="button" data-act="toSolve" data-i18n="act.toSolve">Abrir en Resolver</button>
          </div>
        </fieldset>

        <fieldset data-mode="solve">
          <legend data-i18n="g.solve">Solución</legend>
          <div class="buttons">
            <button class="btn wide desk" type="button" data-act="stepNext" data-i18n="act.next">Siguiente número</button>
            <button class="btn ghost" type="button" data-act="stepPrev" data-i18n="act.prev">Anterior</button>
            <button class="btn ghost" type="button" data-act="stepEnd" data-i18n="act.end">Hasta el final</button>
            <button class="btn ghost wide desk" type="button" data-act="solveAll" data-i18n="act.all">Resolver todo</button>
            <button class="btn ghost wide" type="button" data-act="playThis" data-i18n="act.play">Jugar este sudoku</button>
          </div>
        </fieldset>

        <fieldset data-mode="solve">
          <legend data-i18n="g.sudoku">Sudoku</legend>
          <div class="buttons">
            <button class="btn ghost" type="button" data-act="paste" data-i18n="act.paste">Pegar</button>
            <button class="btn ghost" type="button" data-act="copy" data-i18n="act.copy">Copiar</button>
            <button class="btn ghost" type="button" data-act="generate" data-i18n="act.gen">Generar uno</button>
            <button class="btn ghost" type="button" data-act="fromPlay" data-i18n="act.fromPlay">Traer partida</button>
            <button class="btn ghost desk" type="button" data-act="erase" data-i18n="act.erase">Borrar</button>
            <button class="btn ghost" type="button" data-act="clear" data-i18n="act.clear">Limpiar</button>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="g.options">Opciones</legend>
          <div class="chips">
            <button class="chip" type="button" data-opt="peers" aria-pressed="true" data-i18n="opt.peers">Fila, columna y caja</button>
            <button class="chip" type="button" data-opt="same" aria-pressed="true" data-i18n="opt.same">Mismo número</button>
            <button class="chip" type="button" data-opt="dups" aria-pressed="true" data-i18n="opt.dups">Repetidos</button>
            <button class="chip" type="button" data-opt="timer" aria-pressed="true" data-i18n="opt.timer">Cronómetro</button>
            <button class="chip fine-only" type="button" data-opt="pad" aria-pressed="false" data-i18n="opt.pad">Barra numérica</button>
          </div>
        </fieldset>

        <fieldset class="m-only">
          <legend data-i18n="g.look">Aspecto</legend>
          <div class="row"><button class="chip theme-btn" type="button">Tema: auto</button></div>
        </fieldset>

        <fieldset class="help fine-only">
          <legend data-i18n="g.keys">Teclas</legend>
          <dl class="keys">
            <dt><kbd>1</kbd>–<kbd>9</kbd></dt><dd data-i18n="k.digit"></dd>
            <dt><kbd>Intro</kbd></dt><dd data-i18n="k.notes"></dd>
            <dt><kbd>⇧</kbd>+<kbd>1</kbd>–<kbd>9</kbd></dt><dd data-i18n="k.pos"></dd>
            <dt><kbd>Alt</kbd>+<kbd>1</kbd>–<kbd>9</kbd></dt><dd data-i18n="k.dis"></dd>
            <dt><kbd>Supr</kbd> <kbd>⌫</kbd></dt><dd data-i18n="k.erase"></dd>
            <dt><kbd>H</kbd></dt><dd data-i18n="k.hint"></dd>
            <dt><kbd>Ctrl</kbd>+<kbd>Z</kbd></dt><dd data-i18n="k.undo"></dd>
            <dt><kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd></dt><dd data-i18n="k.move"></dd>
            <dt><kbd>Esc</kbd></dt><dd data-i18n="k.close"></dd>
          </dl>
        </fieldset>
      </div>
    </details>

    <div class="deck" role="group" data-i18n-aria="deck">
      <button class="btn" type="button" data-mode="play" data-act="hint" data-i18n="act.hint">Pista</button>
      <button class="btn ghost" type="button" data-mode="play" data-act="undo" data-i18n="act.undo">Deshacer</button>
      <button class="btn" type="button" data-mode="solve" data-act="stepNext" data-i18n="act.next">Siguiente número</button>
      <button class="btn ghost" type="button" data-mode="solve" data-act="solveAll" data-i18n="act.all">Resolver todo</button>
      <button class="btn ghost" type="button" data-act="erase" data-i18n="act.erase">Borrar</button>
    </div>

    <main class="screen">
      <div class="stage" id="stage">
        <div class="board" id="board" role="group" data-i18n-aria="board"></div>
        <div class="pad" id="pad"></div>
      </div>
      <div class="msg" id="msg" aria-live="polite"></div>
      <div class="status"><span id="status-text"></span><button class="timer" id="timer" type="button"></button></div>
    </main>
  </div>

  <dialog id="dialog">
    <form method="dialog">
      <h2 id="dialog-title"></h2>
      <p id="dialog-text"></p>
      <textarea id="dialog-input" spellcheck="false" autocomplete="off" hidden></textarea>
      <div class="row actions">
        <button class="btn ghost" value="cancel" id="dialog-cancel"></button>
        <button class="btn" value="ok" id="dialog-ok"></button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
